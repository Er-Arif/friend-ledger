name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          if [[ "${TAG}" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi
          echo "Target Release Tag: ${TAG}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run Mobile Validation Checks
        working-directory: mobile
        run: |
          npm test
          npm run lint
          npx tsc --noEmit
          npx expo-doctor

      - name: Run Clean Expo Android Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Decode Android Release Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/release.keystore
          chmod 600 mobile/android/release.keystore

      - name: Build Android Release APK
        working-directory: mobile/android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_BASE_URL: https://backend-production-a749.up.railway.app
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature & Permanent Certificate
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
          echo "Using apksigner: $APKSIGNER"
          CERT_OUTPUT=$($APKSIGNER verify --print-certs "$APK_PATH")
          echo "$CERT_OUTPUT"
          
          ACTUAL_SHA256=$(echo "$CERT_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256="f8d2253c6cf772063cc26336fa055bb79e814198aa6660be3a76cc16a202e0dd"
          
          echo "Actual Signer SHA-256:   $ACTUAL_SHA256"
          echo "Expected Signer SHA-256: $EXPECTED_SHA256"
          
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::CRITICAL SIGNING MISMATCH! Signer certificate SHA-256 does not match permanent key."
            exit 1
          fi
          echo "Signer certificate successfully verified against permanent key."

      - name: Prepare Release Artifacts
        run: |
          FINAL_APK="Friend-Ledger-${RELEASE_TAG}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$FINAL_APK"
          sha256sum "$FINAL_APK" > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Friend Ledger ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            Friend-Ledger-${{ env.RELEASE_TAG }}.apk
            SHA256SUMS.txt

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          rm -f mobile/android/release.keystore
